name: CI

on:
    push:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.11"

            - name: Install dependencies
              run: pip install -r api/requirements.txt

            - name: Check imports
              run: python -c "import fastapi; import requests; import psycopg2"
                  
            - name:  Check Python syntax
              run: python -m py_compile api/app/main.py

            - name: Say hello
              run: echo "CI is working!"